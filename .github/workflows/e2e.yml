name: E2E Tests

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run E2E tests
        run: firebase emulators:exec --only auth,firestore --project demo-pokernotes "npx playwright test"
        env:
          # demo-* project IDs work with Firebase emulators without authentication
          VITE_FIREBASE_PROJECT_ID: demo-pokernotes
          VITE_FIREBASE_API_KEY: test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-pokernotes.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: demo-pokernotes.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          VITE_FIREBASE_APP_ID: '1:123456789:web:abc123'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
